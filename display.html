<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Video Wall - Pantalla Receptor</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow: hidden;
        }
        /* Contenedor que limita la visión a la pantalla actual */
        #viewport {
            width: 100vw; height: 100vh;
            position: relative; overflow: hidden;
        }
        /* El video se escala matemáticamente al tamaño del muro total */
        video {
            position: absolute;
            top: 0; left: 0;
            transform-origin: top left;
            object-fit: fill; /* Evita bandas negras, estirando el aspecto exacto del grid */
        }
    </style>
</head>
<body>

<div id="viewport">
    <video id="video" autoplay playsinline muted></video>
</div>

<script>
    // 1. Configuración del Video Wall vía URL params. 
    // Ejemplo para Matriz 2x2: display.html?id=1&cols=2&rows=2&col=0&row=0
    const urlParams = new URLSearchParams(window.location.search);
    const displayId = urlParams.get('id') || "1";
    const totalCols = parseInt(urlParams.get('cols')) || 1; // Cuántas columnas totales tiene el muro
    const totalRows = parseInt(urlParams.get('rows')) || 1; // Cuántas filas totales tiene el muro
    const myCol = parseInt(urlParams.get('col')) || 0;       // Mi columna actual (Inicia en 0)
    const myRow = parseInt(urlParams.get('row')) || 0;       // Mi fila actual (Inicia en 0)

    // 2. Aplicar magia CSS de recorte y escalado
    const video = document.getElementById("video");
    video.style.width = (totalCols * 100) + "vw";
    video.style.height = (totalRows * 100) + "vh";
    video.style.transform = `translate(${-myCol * 100}vw, ${-myRow * 100}vh)`;

    // 3. Conexión de señalización dinámica
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}?role=display&id=${displayId}`);
    
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

    pc.ontrack = (event) => {
        console.log("Señal de video recibida para esta porción del muro.");
        if (video.srcObject !== event.streams[0]) {
            video.srcObject = event.streams[0];
        }
    };

    pc.onicecandidate = (e) => {
        if (e.candidate && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: "candidate",
                to: "broadcaster",
                displayId: displayId,
                candidate: e.candidate
            }));
        }
    };

    ws.onmessage = async (msg) => {
        const data = JSON.parse(msg.data);

        if (data.type === "offer") {
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            ws.send(JSON.stringify({ type: "answer", displayId: displayId, answer }));
        } 
        else if (data.type === "candidate") {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => console.error(e));
        }
    };

    ws.onclose = () => { console.log("Desconectado del servidor de señalización."); };
</script>
</body>
</html>
