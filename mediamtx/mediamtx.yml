#Sample mediamtx config file

rtsp: true
rtspAddress: :8554

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

authMethod: internal

authInternalUsers:
  - user: user
    pass: pass
    permissions:
      - action: publish
        path: path1
      - action: read
        path: path1

pathDefaults:
  alwaysAvailable: true
  alwaysAvailableTracks:
    - codec: H264
  
paths:
  path1: